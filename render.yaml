services:
  - type: web
    name: bitget-trading-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn setup_orchestrator:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PAPER_MODE
        value: "true"
      - key: EXECUTION_VENUE
        value: "bitget"
      - key: LEVERAGE
        value: "3"
      - key: RISK_PCT
        value: "0.90"
      - key: FEE_PCT
        value: "0.22"
      - key: MIN_NET_PROFIT
        value: "0.20"
      - key: MIN_BIG8_SHARE
        value: "0.85"
      - key: MIN_VOL_RATIO
        value: "0.05"
      - key: REQ_WIN_STREAK
        value: "6"
      - key: TRAILING_STOP_PCT
        value: "1.0"
      - key: CONTINUATION_REQUIRED
        value: "4"
      - key: MAX_SLIPPAGE
        value: "0.05"
      - key: START_BALANCE
        value: "1.58"
      - key: SYMBOLS
        value: "BTC/USDT:USDT,ETH/USDT:USDT"
      - key: SETUP_URL
        value: "http://localhost:$PORT"
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_SECRET_KEY
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: MEXC_API_KEY
        sync: false
      - key: MEXC_SECRET_KEY
        sync: false
