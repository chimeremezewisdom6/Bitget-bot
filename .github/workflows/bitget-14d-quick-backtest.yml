name: Bitget 14-day quick research sample

on:
  push:
    paths:
      - ".github/workflows/bitget-14d-quick-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitget-14d-quick-research
  cancel-in-progress: false

jobs:
  quick-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BITGET_MAX_MARKETS: "12"
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      BITGET_KEY: ${{ secrets.BITGET_KEY }}
      BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
      BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BITGET_API_PASSWORD: ${{ secrets.BITGET_API_PASSWORD }}
      BITGET_PASSWORD: ${{ secrets.BITGET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Run 14-day backtest on 12 highest-turnover markets
        run: python -u bitget_14d_backtest.py
      - name: Publish quick-sample findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_research/bitget_14d_trend_fuel_summary.json reports/daily_research/bitget_14d_trend_fuel_events.jsonl reports/daily_research/bitget_14d_trend_fuel_report.md
          if git diff --cached --quiet; then
            echo "No report changes to publish."
          else
            git commit -m "Add quick 14-day Bitget trend research sample"
            git push
          fi
