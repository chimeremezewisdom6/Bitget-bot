name: Autonomous Gemini Research Agent

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-chatgpt-research-agent
  cancel-in-progress: false

jobs:
  research-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check Gemini free API connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Run autonomous Gemini research and code review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python autonomous_research_agent.py
      - name: Commit validated agent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movement_mechanics.py fuel_attribution.py research_report.py trend_ignition.py daily_research.py tests/ reports/daily_research/autonomous_agent/
          if git diff --cached --quiet; then
            echo "No agent changes to commit."
            exit 0
          fi
          git commit -m "Autonomous ChatGPT research update"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin HEAD:main
