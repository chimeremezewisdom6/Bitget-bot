name: Bitget Aggressor Decay Backtest

on:
  push:
    branches: [main]
    paths:
      - "bitget_aggressor_decay_backtest.py"
      - ".github/workflows/aggressor-decay-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitget-aggressor-decay-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install aiohttp
      - name: Run Bitget historical trade backtest
        run: python bitget_aggressor_decay_backtest.py
      - name: Publish research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/aggressor_decay/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Publish Bitget aggressor decay backtest"
            git push origin HEAD:main
          fi
      - name: Upload raw event results
        uses: actions/upload-artifact@v4
        with:
          name: bitget-aggressor-decay-14d
          path: reports/aggressor_decay/
          if-no-files-found: error
          retention-days: 30
