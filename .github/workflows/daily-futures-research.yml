name: Bitget Unified Research Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Action for the single root-level scanner
        required: true
        type: choice
        options: [ping, start, collect, status, stop]
        default: ping
  push:
    branches: [main]
    paths:
      - "main.py"
      - "daily_research.py"
      - "cap_watchlist.py"
      - "research_report.py"
      - "shadow_execution.py"
      - ".github/workflows/daily-futures-research.yml"

permissions:
  contents: write

concurrency:
  group: bitget-unified-research-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY || secrets.BITGET_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET || secrets.BITGET_SECRET_KEY || secrets.BITGET_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE || secrets.BITGET_PASSPHRASE || secrets.BITGET_API_PASSWORD || secrets.BITGET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the one scanner entry point
        env:
          SCANNER_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'ping' }}
        run: |
          echo "Scanner action: $SCANNER_ACTION"
          python main.py "$SCANNER_ACTION"
      - name: Verify scanner heartbeat
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.action == 'ping' || inputs.action == 'collect' || inputs.action == 'start')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/daily_research/session.json")
          if not p.exists():
              raise SystemExit("Scanner did not create session state.")
          state = json.loads(p.read_text(encoding="utf-8"))
          if int(state.get("cycles", 0)) < 1:
              raise SystemExit("Scanner has not recorded a successful collection cycle.")
          print(json.dumps({
              "cycles": state.get("cycles"),
              "last_collection_utc": state.get("last_at"),
              "session_active": state.get("active"),
              "trading_enabled": state.get("trading_enabled", False),
          }, indent=2))
          PY
      - name: Commit scanner records and heartbeat
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.action == 'ping' || inputs.action == 'collect' || inputs.action == 'start' || inputs.action == 'stop')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d reports ]; then
            git add -A reports/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record unified Bitget scanner heartbeat"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build portable research package when session ends
        if: inputs.action == 'stop'
        run: python package_research.py
      - name: Upload final research package
        if: inputs.action == 'stop'
        uses: actions/upload-artifact@v4
        with:
          name: bitget-research-package-${{ github.run_id }}
          path: reports/bitget_24h_research_package.zip
          if-no-files-found: warn
          retention-days: 30
