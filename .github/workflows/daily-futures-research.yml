name: 24-Hour Futures Research (Read Only)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Start a new 24-hour session or inspect status
        required: true
        type: choice
        options: [start, status, stop]
        default: start
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bitget-24h-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare one four-band watchlist and start session
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'start'
        run: |
          python - <<'PY'
          import json, sys, time
          from pathlib import Path
          p = Path("reports/daily_research/session.json")
          try:
              state = json.loads(p.read_text())
          except (OSError, json.JSONDecodeError):
              state = {}
          if state.get("active") and time.time() < state.get("settle_epoch", state.get("end_epoch", 0)):
              sys.exit("A research session is already active. Choose status or stop; do not start another.")
          PY
          python cap_watchlist.py
          python daily_research.py start
      - name: Inspect session status
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'status'
        run: python daily_research.py status
      - name: Stop session and build final report
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'stop'
        run: |
          python daily_research.py stop
          python research_report.py
      - name: Collect one scheduled five-minute cycle
        if: github.event_name == 'schedule'
        run: python daily_research.py collect
      - name: Build current research summary
        if: github.event_name == 'schedule'
        run: python research_report.py
      - name: Check whether the session has finished
        id: completion
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              state = json.loads(Path("reports/daily_research/session.json").read_text())
          except (OSError, json.JSONDecodeError):
              state = {"active": False}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("complete=" + str(not state.get("active", False)).lower() + "\n")
          PY
      - name: Commit research records and watchlist
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'start' || inputs.action == 'stop'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d reports ]; then
            git add -A reports/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record read-only futures research"
            git push
          fi
      - name: Upload complete research package
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'stop') || (github.event_name == 'schedule' && steps.completion.outputs.complete == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: bitget-24-hour-futures-research-${{ github.run_id }}
          path: |
            reports/daily_research/
            reports/market_cap_watchlist/
          if-no-files-found: warn
          retention-days: 30
