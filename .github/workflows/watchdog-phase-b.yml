name: Phase B Data Watchdog (Read Only)

on:
  schedule:
    - cron: "11-59/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-b-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: vars.PHASE_B_COLLECTOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            research
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check data quality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.watchdog \
            --repo "${{ github.repository }}" \
            --prefix bitget-5m- \
            --stale-minutes 15 \
            --window-minutes 60 \
            --out reports/watchdog
      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-b-watchdog-${{ github.run_id }}
          path: reports/watchdog/
          if-no-files-found: warn
          retention-days: 14
