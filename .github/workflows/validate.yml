name: Validate Read-Only Futures Research

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile research modules
        run: python -m py_compile main.py daily_research.py cap_watchlist.py research_report.py shadow_execution.py trend_ignition.py package_research.py movement_mechanics.py fuel_attribution.py autonomous_research_agent.py
      - name: Run research and read-only safety tests
        run: python -m unittest discover -s tests -v
