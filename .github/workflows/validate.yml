name: Validate Bitget Demo Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scanner
        run: python -m py_compile scanner.py daily_research.py shadow_research.py shadow_execution.py research_report.py cap_watchlist.py
      - name: Run strategy and safety unit tests
        run: python -m unittest discover -s tests -v
