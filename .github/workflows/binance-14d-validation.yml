name: Binance 14-Day Independent Validation
on:
  push:
    branches: [main]
    paths:
      - "binance_14d_validation.py"
      - ".github/workflows/binance-14d-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: binance-14d-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install "aiohttp>=3.9.0"
      - name: Run 14-day public-data backtest
        run: python -u binance_14d_validation.py
      - name: Upload full event dataset
        uses: actions/upload-artifact@v4
        with:
          name: binance-14d-validation-events
          path: |
            reports/daily_research/binance_14d_validation_events.jsonl
            reports/daily_research/binance_14d_validation_summary.json
          retention-days: 30
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_research/binance_14d_validation_report.md reports/daily_research/binance_14d_validation_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Binance 14-day independent validation"
          git pull --rebase origin main
          git push origin HEAD:main
