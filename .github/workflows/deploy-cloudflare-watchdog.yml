name: Deploy independent Cloudflare research watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/research-watchdog/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets without exposing values
        id: credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          missing=0
          for name in CF_ACCOUNT_ID CF_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare watchdog deployment skipped: GITHUB_DISPATCH_TOKEN is not configured. The GitHub Actions watchdog remains the active recovery path."
            exit 0
          fi
          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.deploy_ready == 'true'

      - name: Install and authenticate Wrangler
        if: steps.credentials.outputs.deploy_ready == 'true'
        working-directory: cloudflare/research-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 --version

      - name: Store GitHub dispatch token as a Cloudflare Worker secret
        if: steps.credentials.outputs.deploy_ready == 'true'
        working-directory: cloudflare/research-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN

      - name: Deploy scheduled watchdog
        if: steps.credentials.outputs.deploy_ready == 'true'
        working-directory: cloudflare/research-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
