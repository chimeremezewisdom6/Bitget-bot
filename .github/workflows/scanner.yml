name: Crypto Order Book & Candle Scanner

on:
  schedule:
    # Runs every minute automatically on GitHub Actions
    - cron: '* * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run Bitget Authenticated Scanner
        env:
          CLOUDFLARE_URL: ${{ secrets.CLOUDFLARE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          # Bitget API Keys (Pulls from Repository Secrets or Variables)
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY || vars.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY || vars.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE || vars.BITGET_PASSPHRASE }}
          # Live Trading Enable Flag (Set to 'true' to allow live real-money execution after 8 wins)
          ALLOW_LIVE_TRADING: "true"
        run: python scanner.py
