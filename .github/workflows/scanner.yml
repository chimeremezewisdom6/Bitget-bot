name: Bitget Rebound Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes
  workflow_dispatch:         # Allows manual 1-click execution anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run Bitget Scanner
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          BITGET_DEMO_MODE: ${{ vars.BITGET_DEMO_MODE }}
          CLOUDFLARE_URL: ${{ secrets.CLOUDFLARE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python scanner.py
