name: Global Market Scanner

on:
  workflow_dispatch: {} # Only run when Render pings it

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests aiohttp ccxt
      - name: Run scanner
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python scanner_script.py
      - name: Commit and push candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidate.json
          git commit -m "Update candidate [skip ci]" || echo "No changes to commit"
          git push
