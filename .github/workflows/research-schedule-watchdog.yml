name: Bitget Research Schedule Watchdog

on:
  # Also run after watchdog changes are merged so the recovery path can be
  # exercised immediately, without waiting for the next scheduled interval.
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-schedule-watchdog.yml'
  # Run two minutes after the primary five-minute collector slots.
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bitget-research-schedule-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the last committed research heartbeat
        id: health
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch a recovery collection only when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          heartbeat_path = "reports/daily_research/heartbeat.json"
          try:
              with open(heartbeat_path, encoding="utf-8") as handle:
                  heartbeat = json.load(handle)
          except (OSError, json.JSONDecodeError):
              heartbeat = {}

          now = datetime.now(timezone.utc)
          raw = heartbeat.get("heartbeat_utc")
          age_minutes = None
          if raw:
              try:
                  stamp = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age_minutes = (now - stamp).total_seconds() / 60
              except ValueError:
                  pass

          runs = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/workflows/daily-futures-research.yml/runs?per_page=10"],
              check=True, capture_output=True, text=True
          )
          active_runs = [
              run for run in json.loads(runs.stdout).get("workflow_runs", [])
              if run.get("status") in ("queued", "in_progress")
          ]
          if active_runs:
              print(f"Collector already has {len(active_runs)} queued/running workflow run(s); no duplicate dispatched.")
              sys.exit(0)

          healthy = (
              age_minutes is not None
              and -1 <= age_minutes < 8
              and heartbeat.get("collection_outcome") == "success"
          )
          if healthy:
              print(f"Latest collection is healthy and {age_minutes:.1f} minutes old; no recovery needed.")
              sys.exit(0)

          print(f"Research heartbeat is stale or unhealthy (age_minutes={age_minutes}, outcome={heartbeat.get('collection_outcome')}); dispatching recovery.")
          subprocess.run(
              [
                  "gh", "api", "--method", "POST",
                  f"repos/{repo}/actions/workflows/daily-futures-research.yml/dispatches",
                  "-F", "ref=main",
                  "-F", "inputs[action]=collect",
              ],
              check=True,
          )
          print("Recovery collection dispatched successfully.")
          PY
